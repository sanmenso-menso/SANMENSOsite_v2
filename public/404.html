<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ページが見つかりません | 三面相</title>
    <style>
      :root {
        color: #111;
        background: #f0f0f0;
        font-family: system-ui, sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(36rem, calc(100% - 3rem));
        border: 4px solid #111;
        padding: 2rem;
        background: #fff;
        box-shadow: 10px 10px 0 #111;
      }
      h1 {
        margin-top: 0;
        font-size: clamp(2.5rem, 12vw, 6rem);
      }
      a {
        display: inline-block;
        border: 3px solid #111;
        padding: 0.75rem 1rem;
        color: #111;
        background: #ffd700;
        font-weight: 700;
      }
      a:focus-visible {
        outline: 4px solid #005fcc;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>指定されたページは見つかりませんでした。URLをご確認ください。</p>
      <a href="/">トップページへ戻る</a>
    </main>
  </body>
</html>
